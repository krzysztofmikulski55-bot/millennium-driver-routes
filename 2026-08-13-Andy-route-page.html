<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver route page</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#00d9a6;--accent-dim:rgba(0,217,166,.12);--accent-glow:rgba(0,217,166,.3);--pickup:#4da3ff;--dropoff:#38d979;--meet:#a78bfa;--meet-glow:rgba(167,139,250,.28);--text:#f0f2ff;--muted:#7b82a8;--done-bg:#12201c;--done-border:#1e3d30;--done-text:#3d7a62}body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:42px}.header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 20px 16px;position:sticky;top:0;z-index:10}.header-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);flex-shrink:0}.company{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.route-title{font-size:22px;font-weight:800;color:var(--text)}.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.meta-pill{font-family:Consolas,monospace;font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:4px 10px;border-radius:20px}.progress-wrap{margin-top:14px;background:var(--surface2);border-radius:4px;height:4px;overflow:hidden}.progress-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;box-shadow:0 0 8px var(--accent-glow)}.progress-label{font-size:11px;color:var(--muted);margin-top:6px;font-family:Consolas,monospace}.wrap{max-width:760px;margin:0 auto}.hint{margin:16px 16px 0;background:rgba(196,160,53,.10);border:1px solid rgba(196,160,53,.25);border-radius:12px;padding:11px;font-weight:700;color:#d4bd70}.nextbar{position:sticky;top:132px;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin:12px 16px 0;box-shadow:0 2px 8px rgba(0,0,0,.22)}.nexttitle{font-weight:800;margin-bottom:9px;color:var(--accent)}.stops{padding:16px;display:flex;flex-direction:column;gap:12px}.stop{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;transition:opacity .3s,border-color .3s,background .3s;position:relative;overflow:hidden}.stop::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px}.stop.pickup::before{background:var(--pickup)}.stop.dropoff::before{background:var(--dropoff)}.stop.meet::before{background:var(--meet)}.stop.done{background:var(--done-bg);border-color:var(--done-border);opacity:.72}.stop.done::before{background:var(--done-border)}.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.num{font-family:Consolas,monospace;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(0,217,166,.25);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.pickup .num{color:var(--pickup);background:rgba(77,163,255,.12);border-color:rgba(77,163,255,.35)}.dropoff .num{color:var(--dropoff);background:rgba(56,217,121,.12);border-color:rgba(56,217,121,.35)}.meet .num{color:var(--meet);background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.35)}.stop.done .num{color:var(--done-text);background:rgba(61,122,98,.12);border-color:var(--done-border)}.name{font-size:17px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}.stop.done .name{color:var(--done-text)}.action{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}.action.pickup{background:rgba(77,163,255,.14);color:var(--pickup);border:1px solid rgba(77,163,255,.28)}.action.dropoff{background:rgba(56,217,121,.14);color:var(--dropoff);border:1px solid rgba(56,217,121,.28)}.action.meet{background:rgba(167,139,250,.16);color:var(--meet);border:1px solid rgba(167,139,250,.32)}.techs{font-size:13px;font-weight:700;color:#9eb8ff;margin-top:6px}.address{font-size:13px;margin:0 0 12px 42px;color:var(--muted);line-height:1.4}.actions{display:flex;gap:8px}.button,.donebtn{box-sizing:border-box;text-align:center;text-decoration:none;border:0;border-radius:12px;font-weight:800;font-size:15px;padding:13px 16px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}.button{flex:1;background:var(--accent);color:#0f1117;box-shadow:0 0 16px var(--accent-glow)}.pickup .button{background:var(--pickup);box-shadow:0 0 16px rgba(77,163,255,.24)}.dropoff .button{background:var(--dropoff);box-shadow:0 0 16px rgba(56,217,121,.24)}.meet .button,.button.meet{background:var(--meet);box-shadow:0 0 16px var(--meet-glow);color:#120a2a}.button:active,.donebtn:active{transform:scale(.97);opacity:.9}.stop.done .button{background:var(--surface2);color:var(--done-text);box-shadow:none}.donebtn{width:52px;flex-shrink:0;background:var(--surface2);color:var(--text);border:1px solid var(--border);cursor:pointer}.stop.done .donebtn{background:rgba(0,217,166,.08);border-color:rgba(0,217,166,.3)}.nextbar .button{width:100%;box-shadow:0 0 16px var(--accent-glow)}.nextbar .button.meet{background:var(--meet);box-shadow:0 0 16px var(--meet-glow);color:#120a2a}.status{font-weight:800;color:var(--accent);margin-top:10px}.done-banner{display:none;margin:0 16px 20px;background:rgba(0,217,166,.1);border:1px solid rgba(0,217,166,.3);border-radius:16px;padding:20px;text-align:center}.done-banner.show{display:block}.done-banner-emoji{font-size:32px;margin-bottom:8px}.done-banner-title{font-size:18px;font-weight:800;color:var(--accent);margin-bottom:4px}.done-banner-sub{font-size:13px;color:var(--muted)}@media(max-width:520px){.header{padding:18px 16px 14px}.nextbar{top:128px}.stops{padding:12px}.hint,.nextbar,.done-banner{margin-left:12px;margin-right:12px}.name{font-size:16px}.address{margin-left:42px}}
.top{margin-bottom:10px}.address{margin:6px 0 0 42px;font-size:14px;color:#c1c7e0;line-height:1.4}.garage{margin:8px 0 0 42px;display:inline-block;background:rgba(196,160,53,.12);border:1px solid rgba(196,160,53,.30);border-radius:10px;padding:6px 9px;color:#d4bd70;font-size:13px;font-weight:800}.client{margin:12px 0 0 42px;font-size:14px;color:var(--text);font-weight:700;line-height:1.35}.button.bigwaze{font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:16px}.nextbar .button.bigwaze{font-size:18px}.techs{display:none}.action{margin-top:4px}.name{font-size:18px}.actions{margin-left:42px;flex-wrap:wrap}.clientcall{flex:1;min-width:120px;background:#f59e0b;color:#111;box-shadow:0 0 14px rgba(245,158,11,.22);text-decoration:none}.stop.done .clientcall{background:var(--surface2);color:var(--done-text);box-shadow:none}.meetcalls{margin:10px 0 0 42px;display:flex;flex-direction:column;gap:8px}.callbtn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:13px 16px;background:#f59e0b;color:#111;font-size:16px;font-weight:900;box-shadow:0 0 14px rgba(245,158,11,.22)}.callhint{font-size:12px;color:#d4bd70;font-weight:800;margin-bottom:2px}
.nextbar{background:rgba(196,160,53,.10);border-color:rgba(196,160,53,.32)}.nexttitle{color:#d4bd70}.nextbar .button{background:#d4bd70;color:#111;box-shadow:0 0 16px rgba(196,160,53,.22)}.nextbar .button.meet{background:#a78bfa;color:#120a2a;box-shadow:0 0 16px rgba(167,139,250,.28)}.nextactions{display:flex;gap:8px;align-items:stretch}.nextactions .button{flex:1}.quickdone{border:0;border-radius:12px;padding:13px 14px;background:#00d9a6;color:#0f1117;font-size:15px;font-weight:900;box-shadow:0 0 16px rgba(0,217,166,.24);cursor:pointer;-webkit-tap-highlight-color:transparent}.quickdone:active{transform:scale(.97);opacity:.9}.quickdone.last{background:#38d979;box-shadow:0 0 16px rgba(56,217,121,.24)}@media(max-width:520px){.nextactions{flex-direction:column}.quickdone{font-size:17px;padding:15px 16px}.actions{flex-direction:column}.clientcall{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="header-top"><div class="logo-dot"></div><span class="company">MillenniumClean</span></div><div class="route-title">Driver route</div><div id="meta" class="meta-row"></div><div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div><div class="progress-label" id="progress-label"></div></div>
<div class="hint">Tap Waze for navigation. Use Call client when you need the house phone. Garage/key codes are under each stop.</div>
<div class="nextbar"><div id="nextTitle" class="nexttitle"></div><div class="nextactions"><a id="nextWaze" class="button bigwaze" href="#" target="_blank" rel="noopener"></a><button id="nextDoneOpen" class="quickdone" type="button">Done &amp; open next</button></div></div>
<div class="stops" id="stops"></div>
<div class="done-banner" id="done-banner"><div class="done-banner-emoji">OK</div><div class="done-banner-title">Route Complete</div><div class="done-banner-sub">All stops are marked done.</div></div>
</div>
<script>
var batch = {"date":"2026-08-13","displayDate":"Thursday, Aug 13","driverName":"Andy","routeType":"Morning drop-off","stops":[{"index":0,"number":1,"name":"ANDY HAVELY","action":"Drop off","technicians":"BOGUSLAWA, HALINA","address":"21760 W. WASHINGTON ST, GRAYSLAKE IL 60030","garage":"","phone":"847 366 8634","phoneUrl":"tel:8473668634","wazeUrl":"https://www.waze.com/ul?q=21760%20W.%20WASHINGTON%20ST%2C%20GRAYSLAKE%20IL%2060030\u0026navigate=yes","otherDrivers":[]},{"index":1,"number":2,"name":"ANN SMITH","action":"Drop off","technicians":"OLESIA","address":"12 OAK AVE., GRAYSLAKE IL 60030","garage":"","phone":"847 772 40 81","phoneUrl":"tel:8477724081","wazeUrl":"https://www.waze.com/ul?q=12%20OAK%20AVE.%2C%20GRAYSLAKE%20IL%2060030\u0026navigate=yes","otherDrivers":[]},{"index":2,"number":3,"name":"KIM LUND","action":"Drop off","technicians":"LARYSA","address":"17609 W JULIE LN, GURNEE IL 60031","garage":"","phone":"847","phoneUrl":"tel:847","wazeUrl":"https://www.waze.com/ul?q=17609%20W%20JULIE%20LN%2C%20GURNEE%20IL%2060031\u0026navigate=yes","otherDrivers":[]}]};
(function() {
  var done = loadDoneState();

  function byId(id) {
    return document.getElementById(id);
  }

  function setText(el, text) {
    if (el) el.textContent = text || '';
  }

  function storageKey() {
    var parts = [batch.date || '', batch.routeType || '', batch.driverName || ''];
    var stops = batch.stops || [];
    for (var i = 0; i < stops.length; i++) {
      parts.push((stops[i].name || '') + '@' + (stops[i].address || ''));
    }
    return 'millennium-driver-route-done:' + parts.join('|');
  }

  function loadDoneState() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(storageKey());
      return raw ? JSON.parse(raw) || {} : {};
    } catch (e) {
      return {};
    }
  }

  function saveDoneState() {
    try {
      if (window.localStorage) window.localStorage.setItem(storageKey(), JSON.stringify(done || {}));
    } catch (e) {
    }
  }

  function render() {
    renderMeta();
    updateNextStop();
    var root = byId('stops');
    if (!root) return;
    root.innerHTML = '';
    var stops = batch.stops || [];
    for (var i = 0; i < stops.length; i++) {
      root.appendChild(renderStop(stops[i], i));
    }
    updateProgress();
  }

  function renderMeta() {
    var meta = byId('meta');
    if (!meta) return;
    meta.innerHTML = '';
    addMetaPill(meta, batch.displayDate || batch.date || '');
    addMetaPill(meta, (batch.stops || []).length + ' stop' + ((batch.stops || []).length === 1 ? '' : 's'));
    addMetaPill(meta, batch.routeType || '');
    if (batch.driverName) addMetaPill(meta, batch.driverName);
  }

  function addMetaPill(root, text) {
    if (!text) return;
    var pill = document.createElement('span');
    pill.className = 'meta-pill';
    setText(pill, text);
    root.appendChild(pill);
  }

  function renderStop(stop, index) {
    var card = document.createElement('div');
    card.className = 'stop ' + actionClass(stop);
    if (done[index]) card.className += ' done';

    var top = document.createElement('div');
    top.className = 'top';

    var num = document.createElement('div');
    num.className = 'num';
    setText(num, stop.number || (index + 1));

    top.appendChild(num);
    card.appendChild(top);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var waze = document.createElement('a');
    waze.className = 'button bigwaze';
    waze.href = stop.wazeUrl || '#';
    waze.target = '_blank';
    waze.rel = 'noopener';
    setText(waze, wazeButtonText(stop, index));

    var doneButton = document.createElement('button');
    doneButton.type = 'button';
    doneButton.className = 'donebtn';
    setText(doneButton, done[index] ? 'OK' : 'Done');
    doneButton.onclick = function() {
      done[index] = !done[index];
      saveDoneState();
      render();
    };

    actions.appendChild(waze);
    if (stop.phoneUrl) {
      var callClient = document.createElement('a');
      callClient.className = 'button clientcall';
      callClient.href = stop.phoneUrl;
      setText(callClient, 'Call client');
      actions.appendChild(callClient);
    }
    actions.appendChild(doneButton);
    card.appendChild(actions);

    if (actionClass(stop) === 'meet') {
      var callBox = renderMeetCalls(stop);
      if (callBox) card.appendChild(callBox);
    }

    var client = document.createElement('div');
    client.className = 'client';
    setText(client, stop.name ? 'Client: ' + stop.name : '');
    if (stop.name) card.appendChild(client);

    var address = document.createElement('div');
    address.className = 'address';
    setText(address, stop.address || 'No address');
    card.appendChild(address);

    var garage = document.createElement('div');
    garage.className = 'garage';
    setText(garage, stop.garage ? 'Garage / key: ' + stop.garage : '');
    if (stop.garage && actionClass(stop) !== 'meet') card.appendChild(garage);

    if (done[index]) {
      var status = document.createElement('div');
      status.className = 'status';
      setText(status, 'Done');
      card.appendChild(status);
    }

    return card;
  }

  function renderMeetCalls(stop) {
    var drivers = (stop && stop.otherDrivers) || [];
    if (!drivers.length) return null;

    var box = document.createElement('div');
    box.className = 'meetcalls';
    var hint = document.createElement('div');
    hint.className = 'callhint';
    setText(hint, 'Schedule meet with other driver:');
    box.appendChild(hint);

    for (var i = 0; i < drivers.length; i++) {
      var driver = drivers[i] || {};
      if (!driver.phoneUrl) continue;
      var link = document.createElement('a');
      link.className = 'callbtn';
      link.href = driver.phoneUrl;
      setText(link, 'Call ' + (driver.name || 'other driver'));
      box.appendChild(link);
    }

    return box.children.length > 1 ? box : null;
  }

  function updateProgress() {
    var stops = batch.stops || [];
    var doneCount = 0;
    for (var i = 0; i < stops.length; i++) {
      if (done[i]) doneCount++;
    }
    var total = stops.length;
    var pct = total ? (doneCount / total * 100) : 0;
    var bar = byId('progress-bar');
    var label = byId('progress-label');
    var banner = byId('done-banner');
    if (bar) bar.style.width = pct + '%';
    if (label) setText(label, doneCount + ' of ' + total + ' complete');
    if (banner) banner.className = doneCount === total && total > 0 ? 'done-banner show' : 'done-banner';
  }

  function nextStopIndex() {
    var stops = batch.stops || [];
    for (var i = 0; i < stops.length; i++) {
      if (!done[i]) return i;
    }
    return -1;
  }

  function updateNextStop() {
    var index = nextStopIndex();
    var title = byId('nextTitle');
    var link = byId('nextWaze');
    var doneOpen = byId('nextDoneOpen');
    if (!title || !link) return;
    if (index < 0) {
      setText(title, 'All stops are marked done.');
      link.style.display = 'none';
      if (doneOpen) doneOpen.style.display = 'none';
      return;
    }
    var stop = (batch.stops || [])[index] || {};
    setText(title, 'Next stop');
    link.href = stop.wazeUrl || '#';
    link.className = 'button bigwaze ' + actionClass(stop);
    setText(link, wazeButtonText(stop, index));
    link.style.display = 'block';
    if (doneOpen) {
      doneOpen.style.display = 'block';
      doneOpen.className = nextStopAfter(index) < 0 ? 'quickdone last' : 'quickdone';
      setText(doneOpen, nextStopAfter(index) < 0 ? 'Done - finish route' : 'Done & open next');
    }
  }

  function nextStopAfter(index) {
    var stops = batch.stops || [];
    for (var i = index + 1; i < stops.length; i++) {
      if (!done[i]) return i;
    }
    return -1;
  }

  function doneAndOpenNext() {
    var current = nextStopIndex();
    if (current < 0) return;
    done[current] = true;
    saveDoneState();
    var next = nextStopAfter(current);
    render();
    if (next >= 0) {
      var stop = (batch.stops || [])[next] || {};
      if (stop.wazeUrl) window.location.href = stop.wazeUrl;
    }
  }

  function wazeButtonText(stop, index) {
    if (actionClass(stop) === 'meet') return exchangeButtonText(stop);
    return actionLabel(stop) + ' ' + firstTechnicianNames(stop && stop.technicians);
  }

  function exchangeButtonText(stop) {
    var names = exchangeTechnicianNames((stop && (stop.technicians || stop.garage)) || '');
    return names ? 'EXCHANGE: ' + names : 'EXCHANGE';
  }

  function exchangeTechnicianNames(value) {
    value = String(value || '').trim();
    if (!value) return '';
    var names = [];
    var parts = value.split(/\s*;\s*/);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i].trim();
      if (!part) continue;
      var match = part.match(/^(?:Give|Receive):\s*(.+)$/i);
      if (!match) continue;
      var rawNames = match[1].split(/\s*(?:,|&|\+| and )\s*/i);
      for (var n = 0; n < rawNames.length; n++) {
        var name = rawNames[n].trim();
        if (name) names.push(name.toUpperCase());
      }
    }
    return names.length ? names.join(' / ') : value.toUpperCase();
  }

  function firstTechnicianNames(value) {
    value = String(value || '').trim();
    if (!value) return 'TECH';
    var parts = value.split(/\s*(?:,|&|\+| and )\s*/i);
    var names = [];
    for (var i = 0; i < parts.length; i++) {
      var piece = parts[i].trim();
      if (!piece) continue;
      names.push(piece.split(/\s+/)[0].toUpperCase());
    }
    return names.length ? names.join(' & ') : 'TECH';
  }

  function actionClass(stop) {
    var text = String((stop && stop.action) || '').toLowerCase();
    if (text.indexOf('meet') >= 0) return 'meet';
    if (text.indexOf('pick') >= 0) return 'pickup';
    if (text.indexOf('drop') >= 0) return 'dropoff';
    return '';
  }

  function actionLabel(stop) {
    var cls = actionClass(stop);
    if (cls === 'meet') return 'MEET';
    if (cls === 'pickup') return 'PICK UP';
    if (cls === 'dropoff') return 'DROP OFF';
    return (stop && stop.action) || 'STOP';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
  var doneOpen = byId('nextDoneOpen');
  if (doneOpen) doneOpen.onclick = doneAndOpenNext;
})();
</script>
</body>
</html>
